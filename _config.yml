title: Keycloak VM documentation
baseurl: /keycloak-azure-marketplace-docs
markdown: kramdown
strict_front_matter: true
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
kramdown:
  input: GFM
defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: en
exclude:
  - _work
  - scripts
  - vendor
  - Gemfile
  - Gemfile.lock
  - Makefile
  - CONTRIBUTING.md
  - CONTRIBUTING-fr.md
